<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="96" height="95" viewBox="0 0 96 95" fill="none">
  <title>1 Minute Report logo</title>
  <desc>Vector reconstruction of the supplied 96 by 95 pixel logo. Transparent background; paths and gradients only.</desc>
  <defs>
    <filter id="softHighlight" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="1.15"/>
    </filter>
    <linearGradient id="ring" x1="24" y1="7" x2="64" y2="85" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00e6ed"/>
      <stop offset=".24" stop-color="#00c9f3"/>
      <stop offset=".53" stop-color="#0088ff"/>
      <stop offset=".8" stop-color="#0053ff"/>
      <stop offset="1" stop-color="#0829f3"/>
    </linearGradient>
    <linearGradient id="ringShine" x1="24" y1="8" x2="60" y2="83" gradientUnits="userSpaceOnUse">
      <stop stop-color="#49ffff" stop-opacity=".65"/>
      <stop offset=".46" stop-color="#00d6ff" stop-opacity=".12"/>
      <stop offset="1" stop-color="#0878ff" stop-opacity=".28"/>
    </linearGradient>
    <linearGradient id="numberEdge" x1="31" y1="28" x2="53" y2="66" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset=".42" stop-color="#eef9fc"/>
      <stop offset=".79" stop-color="#b9e5f1"/>
      <stop offset="1" stop-color="#3d9fe4"/>
    </linearGradient>
    <linearGradient id="numberFace" x1="37" y1="41" x2="52" y2="43" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset=".65" stop-color="#f5fbfd"/>
      <stop offset=".85" stop-color="#e8f4fa"/>
      <stop offset="1" stop-color="#b6dff4"/>
    </linearGradient>
    <linearGradient id="numberBottom" x1="43" y1="62" x2="43" y2="71" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".58" stop-color="#d2f0f8" stop-opacity=".2"/>
      <stop offset="1" stop-color="#4eace9" stop-opacity=".85"/>
    </linearGradient>
    <linearGradient id="check" x1="70" y1="35" x2="80" y2="60" gradientUnits="userSpaceOnUse">
      <stop stop-color="#02e9ec"/>
      <stop offset=".28" stop-color="#00c6f6"/>
      <stop offset=".61" stop-color="#008aff"/>
      <stop offset="1" stop-color="#0037f7"/>
    </linearGradient>
    <linearGradient id="checkShine" x1="71" y1="33" x2="78" y2="53" gradientUnits="userSpaceOnUse">
      <stop stop-color="#61ffff" stop-opacity=".6"/>
      <stop offset=".64" stop-color="#00ddff" stop-opacity=".12"/>
      <stop offset="1" stop-color="#00a6ff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Circular band, with a break under the check mark. -->
  <path d="M79.6 29.8 A37.3 37.3 0 1 0 82.9 51.5" transform="translate(0 .8)" stroke="#0736f1" stroke-width="12.9" stroke-linecap="round"/>
  <path d="M79.6 29.8 A37.3 37.3 0 1 0 82.9 51.5" stroke="url(#ring)" stroke-width="12.6" stroke-linecap="round"/>
  <path d="M79.1 28.7 C71.9 13.6 55.3 5.5 40.8 8.2 C20.7 10.9 7.2 26.8 7.2 45.7 C7.2 65.9 23.8 82.7 45 82.7 C61.5 82.7 76.5 71.9 81.3 56.4" filter="url(#softHighlight)" stroke="url(#ringShine)" stroke-width="3.3" stroke-linecap="round"/>
  <!-- The numeral is outlined geometry, not text or a font. -->
  <path d="M39.3 22.9 L50.2 22.9 Q53 23.2 53 27.4 L53 67.9 Q53 71.5 49.5 71.5 L40.5 71.5 Q37 71.5 37 68.2 L37 39.7 L31.3 43 Q29.3 44 28.1 41.8 L25.9 37.7 Q24.5 34.4 27.1 32.5 Z" fill="url(#numberEdge)"/>
  <path d="M39.7 23.1 L49.5 23.1 Q51.1 23.1 51.1 26.2 L51.1 66.7 Q51.1 69 48.7 69 L40.8 69 Q38.7 69 38.7 66.8 L38.7 35.1 L30.8 40.5 Q29.5 41.5 28.6 39.7 L26.8 36.2 Q26.2 34.7 27.7 33.7 Z" fill="url(#numberFace)"/>
  <path d="M37 60 H53 V67.9 Q53 71.5 49.5 71.5 H40.5 Q37 71.5 37 68.2 Z" fill="url(#numberBottom)"/>
  <path d="M39.5 23.1 H49.6" stroke="#ffffff" stroke-width="1.1" stroke-linecap="round"/>
  <!-- Rounded check mark, with a blue lower bevel. -->
  <path d="M59.4 51.5 L65.6 59.6 L87.4 37.3" stroke="#0730e9" stroke-width="13.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M59 50.7 L65.2 58.6 L87.4 36.2" stroke="url(#check)" stroke-width="12.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M59 49.5 L65.2 57 L87.2 35.3" filter="url(#softHighlight)" stroke="url(#checkShine)" stroke-width="7.4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
